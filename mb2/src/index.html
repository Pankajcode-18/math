<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:;">
  <title>PiyushDhara MathBoard</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>

<!-- ══════════ TOPBAR ══════════ -->
<header id="topbar">
  <img class="brand-logo" id="brand-logo" src="../assets/logo.png" alt="PiyushDhara">
  <div class="brand-wrap">
    <span class="brand-name">PiyushDhara</span>
    <span class="brand-sub">EduVerse · MathBoard</span>
  </div>
  <div class="tb-div"></div>
  <div class="chapter-info">
    <span class="lbl">Active Chapter</span>
    <span class="val" id="active-ch-label">Ch 1 — Sets</span>
  </div>
  <div class="tb-div"></div>
  <!-- Board color picker -->
  <span class="board-lbl">Board</span>
  <div class="board-swatch-wrap" id="board-swatches"></div>
  <div class="spacer"></div>
  <!-- Actions -->
  <button class="tb-btn graph-btn" id="btn-graph" title="Live Graphs & Statistics">
    <svg viewBox="0 0 20 20" fill="none"><polyline points="2,15 6,9 10,12 14,5 18,8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="9" r="1.5" fill="currentColor"/><circle cx="10" cy="12" r="1.5" fill="currentColor"/><circle cx="14" cy="5" r="1.5" fill="currentColor"/></svg>
    Graphs
  </button>
  <button class="tb-btn lib-btn" id="btn-library" title="Presentation Library">
    <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M6 4V2M14 4V2M2 8h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    Library
  </button>
  <button class="tb-btn" id="btn-tools" onclick="UI.toggleChapterPanel()">
    <svg viewBox="0 0 20 20" fill="none"><path d="M4 6h12M4 10h8M4 14h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    Chapter Tools
  </button>
  <button class="tb-btn" id="btn-load" onclick="App.loadBoard()">
    <svg viewBox="0 0 20 20" fill="none"><path d="M3 10V16a1 1 0 001 1h12a1 1 0 001-1V10M10 3v10M7 6l3-3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Load
  </button>
  <button class="tb-btn" id="btn-save" onclick="App.saveBoard()">
    <svg viewBox="0 0 20 20" fill="none"><path d="M4 3h9l4 4v10a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1zM7 3v5h6V3M7 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Save
  </button>
  <button class="tb-btn" id="btn-snap" onclick="App.takeSnapshot()">
    <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="5" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="11" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M7 5l1.5-2h3L13 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    Snapshot
  </button>
  <button class="tb-btn pdf-btn" id="btn-pdf" onclick="App.exportPDF()" title="Export all pages as PDF">
    <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="11" height="15" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10h5M6 13h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M14 11l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Export PDF
  </button>
  <button class="tb-btn danger" onclick="App.clearBoard()">
    <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    Clear
  </button>
  <button class="tb-btn rec" id="btn-rec" onclick="App.toggleRecord()">
    <span class="rec-dot"></span> Record
  </button>
</header>

<!-- ══════════ PAGE TABS BAR ══════════ -->
<div id="page-tabs-bar">
  <!-- tabs injected by JS -->
  <button id="add-page-btn" onclick="App.addPage()" title="Add new page">＋</button>
</div>

<!-- ══════════ MAIN ══════════ -->
<main id="app-main">

  <!-- LEFT SIDEBAR -->
  <aside id="sidebar">
    <div class="sb-label">Nepal SEE — Math</div>
    <nav id="chapter-nav"></nav>
  </aside>

  <!-- LEFT TOGGLE TAB — outside sidebar so it never gets clipped -->
  <button id="sb-toggle" onclick="App.toggleSidebar()" title="Hide / show chapters">◀</button>

  <!-- TOOL PALETTE -->
  <div id="tool-palette">
    <button class="tool-btn active" data-tool="select" title="Select (V)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M5 3l13 8-7 2-3 7L5 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Select</span>
    </button>
    <button class="tool-btn" data-tool="pen" title="Pen (P)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M4 17l2.5-2.5 9-9a2 2 0 112.8 2.8l-9 9L4 17z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Pen</span>
    </button>
    <button class="tool-btn" data-tool="highlighter" title="Highlight (H)">
      <svg viewBox="0 0 22 22" fill="none"><rect x="5" y="8" width="12" height="7" rx="2" stroke="currentColor" stroke-width="1.6" fill="rgba(255,220,50,0.22)"/><path d="M9 15v3M13 15v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Marker</span>
    </button>
    <button class="tool-btn" data-tool="text" title="Text (T)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M5 6h12M11 6v11M8 17h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Text</span>
    </button>
    <div class="t-sep"></div>
    <button class="tool-btn" data-tool="line" title="Line (L)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M4 18L18 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Line</span>
    </button>
    <button class="tool-btn" data-tool="dashed" title="Dashed Line (D)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M4 18L18 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3.5 2.5"/></svg>
      <span>Dashed</span>
    </button>
    <button class="tool-btn" data-tool="dotted" title="Dotted Line">
      <svg viewBox="0 0 22 22" fill="none"><path d="M4 18L18 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 3.5"/></svg>
      <span>Dotted</span>
    </button>
    <button class="tool-btn" data-tool="arrow" title="Arrow (A)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M4 18L18 4M11 4h7v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Arrow</span>
    </button>
    <button class="tool-btn" data-tool="dbl-arrow" title="Double Arrow">
      <svg viewBox="0 0 22 22" fill="none"><path d="M4 18L18 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M11 4h7v7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 18H4v-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>↔ Arrow</span>
    </button>
    <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M4 17h14M7 17L4 13l8-8 6 6-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Erase</span>
    </button>
    <div class="t-sep"></div>
    <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M5 10a6 6 0 106 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5 5v5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Undo</span>
    </button>
    <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 22 22" fill="none"><path d="M17 10a6 6 0 11-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M17 5v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Redo</span>
    </button>
  </div>

  <!-- CANVAS ZONE -->
  <div id="canvas-zone">
    <canvas id="grid-canvas"></canvas>
    <canvas id="shape-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
    <canvas id="ui-canvas"></canvas>
    <!-- Text editor injected dynamically by Drawing.placeText() -->

    <!-- Chapter Tools — slides DOWN from top -->
    <div id="chapter-panel">
      <div class="cp-head">
        <span class="cp-icon">⚡</span>
        <span id="cp-title">Chapter Tools</span>
        <button class="cp-close" onclick="UI.toggleChapterPanel()">✕</button>
      </div>
      <div id="cp-body"></div>
    </div>

    <!-- Formula badge near selected shape -->
    <div id="formula-badge" class="hidden">
      <div class="fb-name" id="fb-name"></div>
      <div class="fb-expr" id="fb-expr"></div>
      <div class="fb-result" id="fb-result"></div>
    </div>
  </div>

  <!-- RIGHT TOGGLE TAB — outside right-panel so it never gets clipped -->
  <button id="rp-toggle" onclick="App.toggleRPanel()" title="Hide / show shapes panel">▶</button>

  <!-- RIGHT PANEL -->
  <div id="right-panel">

    <div class="rp-sec">
      <div class="rp-lbl">Shapes</div>
      <div id="shape-grid"></div>
    </div>

    <div class="rp-sec">
      <div class="rp-lbl">Color</div>
      <div id="color-palette"></div>
      <div class="cust-row">
        <label>Custom</label>
        <input type="color" id="custom-color" value="#ffffff">
      </div>
    </div>

    <div class="rp-sec" id="pen-sz-sec">
      <div class="rp-lbl">Pen Size</div>
      <div id="pen-sizes"></div>
    </div>

    <div class="rp-sec" id="props-sec" style="display:none">
      <div class="rp-lbl">Dimensions <span style="font-size:8px;opacity:.5;font-weight:400;letter-spacing:.05em;text-transform:none">— type any value, press Enter</span></div>
      <div id="props-content"></div>
    </div>
  </div>

</main>

<!-- ══════════ STATUS BAR ══════════ -->
<footer id="statusbar">
  <span>Tool: <b id="sb-tool">Select</b></span>
  <span>Page: <b id="sb-page">1</b></span>
  <span>Objects: <b id="sb-objs">0</b></span>
  <span id="sb-pos">x: 0  y: 0</span>
  <span class="sb-end">PiyushDhara EduVerse · MathBoard v2.0</span>
</footer>

<!-- SCRIPTS (order matters) -->
<script src="chapters/data.js"></script>
<script src="tools/shapes.js"></script>
<script src="tools/canvas.js"></script>
<script src="tools/drawing.js"></script>
<script src="chapters/calculators.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// GRAPH ENGINE — Live Interactive Graphs & Statistics
// Tabs: Line Graph, Bar Chart, Pie Chart, Scatter Plot,
//       Histogram, Statistics Dashboard
// ═══════════════════════════════════════════════════════════

const GraphEngine = (() => {

  let visible   = false;
  let activeTab = 'line';
  let animFrame = null;

  // ── Colour palette for charts ──
  const COLORS = [
    '#4e9af1','#f1a94e','#4ef17a','#f14e8a',
    '#a94ef1','#f14e4e','#4ef1e8','#f1e84e'
  ];

  // ── State for each tab ──
  const state = {
    line: {
      title: 'Line Graph',
      datasets: [
        { label:'Series A', color:'#4e9af1', points:[{x:-3,y:4},{x:-1,y:-2},{x:0,y:1},{x:2,y:5},{x:4,y:-1},{x:5,y:3}] },
        { label:'Series B', color:'#f1a94e', points:[{x:-4,y:-3},{x:-2,y:2},{x:0,y:-1},{x:1,y:4},{x:3,y:-2},{x:5,y:6}] },
      ],
      xLabel:'x', yLabel:'y', showGrid:true, showPoints:true, smooth:false,
    },
    bar: {
      title: 'Bar Chart',
      labels:  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
      datasets:[
        { label:'Students', color:'#4e9af1', values:[12,19,8,15,22,10,18] },
        { label:'Absent',   color:'#f14e4e', values:[3,5,2,4,6,1,3] },
      ],
      xLabel:'Day', yLabel:'Count',
    },
    pie: {
      title: 'Pie / Donut Chart',
      labels:  ['Algebra','Geometry','Arithmetic','Statistics','Probability'],
      values:  [30,25,20,15,10],
      donut: false,
    },
    scatter: {
      title: 'Scatter Plot',
      datasets:[
        { label:'Group A', color:'#4e9af1', points:[{x:2,y:4},{x:3,y:6},{x:4,y:3},{x:6,y:8},{x:7,y:5},{x:8,y:9}] },
        { label:'Group B', color:'#f1a94e', points:[{x:1,y:7},{x:3,y:2},{x:5,y:6},{x:7,y:3},{x:9,y:7}] },
      ],
      showTrendline: false,
      xLabel:'X', yLabel:'Y',
    },
    histogram: {
      title: 'Histogram (Frequency Distribution)',
      rawData: '12,15,18,22,14,19,25,17,21,13,16,20,23,18,15,24,19,22,14,17',
      bins: 5,
      xLabel:'Class Interval', yLabel:'Frequency',
    },
    stats: {
      title: 'Statistics Dashboard',
      data: '12,18,14,16,20,15,13,19,17,11,22,16,14,18,20',
      groupedData: '10-20:5, 20-30:8, 30-40:6, 40-50:3',
    }
  };

  // ════════════════════════════════════════════════════════
  // SHOW / HIDE
  // ════════════════════════════════════════════════════════
  function show() {
    visible = true;
    let overlay = document.getElementById('graph-overlay');
    if (!overlay) { overlay = createOverlay(); }
    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.opacity = '1'; }, 10);
    switchTab(activeTab);
  }

  function hide() {
    visible = false;
    const overlay = document.getElementById('graph-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.display = 'none'; }, 280);
    }
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  }

  function toggle() { visible ? hide() : show(); }

  // ════════════════════════════════════════════════════════
  // BUILD OVERLAY
  // ════════════════════════════════════════════════════════
  function createOverlay() {
    const overlay = document.createElement('div');
    overlay.id = 'graph-overlay';
    overlay.style.cssText = `
      position:fixed; inset:0; z-index:1000;
      background:rgba(5,10,20,0.97);
      display:flex; flex-direction:column;
      opacity:0; transition:opacity .28s ease;
      font-family:'Segoe UI',system-ui,sans-serif;
    `;

    // Header
    overlay.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;
        background:linear-gradient(90deg,#060e1c,#101d3a,#060e1c);
        border-bottom:1.5px solid #c9a84c;flex-shrink:0">
        <img src="../assets/logo.png" style="height:34px;width:34px;object-fit:contain;
          filter:drop-shadow(0 0 6px rgba(201,168,76,.5))">
        <div>
          <div style="font-family:Georgia,serif;font-size:15px;font-weight:700;
            color:#e8c96b;letter-spacing:.06em">PiyushDhara MathBoard</div>
          <div style="font-size:9px;color:#c9a84c;letter-spacing:.18em;
            text-transform:uppercase;opacity:.7">Graph & Statistics Engine</div>
        </div>
        <div style="flex:1"></div>
        <button id="graph-close-btn" style="
          padding:7px 14px;border-radius:6px;border:1px solid rgba(239,68,68,.4);
          background:rgba(239,68,68,.1);color:#fca5a5;font-size:12px;font-weight:600;
          cursor:pointer;font-family:'Segoe UI',sans-serif;touch-action:manipulation">
          ✕ Close
        </button>
      </div>

      <!-- Tab bar -->
      <div id="graph-tabs" style="display:flex;gap:0;background:#080f1f;
        border-bottom:1px solid rgba(201,168,76,.18);flex-shrink:0;overflow-x:auto">
      </div>

      <!-- Main area: controls left, canvas right -->
      <div style="display:flex;flex:1;overflow:hidden">
        <!-- Controls -->
        <div id="graph-controls" style="width:300px;min-width:260px;background:#0d1b38;
          border-right:1px solid rgba(201,168,76,.18);overflow-y:auto;flex-shrink:0;
          padding:14px 12px">
        </div>
        <!-- Chart canvas -->
        <div style="flex:1;position:relative;padding:16px;display:flex;
          flex-direction:column;gap:10px">
          <canvas id="graph-canvas" style="flex:1;border-radius:10px;
            background:rgba(255,255,255,0.03);border:1px solid rgba(201,168,76,.15)">
          </canvas>
          <div id="graph-stats-row" style="display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0"></div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);
    buildTabs();

    // Wire close button
    const closeBtn = document.getElementById('graph-close-btn');
    if (closeBtn) closeBtn.addEventListener('click', hide);

    // Resize canvas on window resize
    window.addEventListener('resize', () => {
      if (visible) setTimeout(render, 100);
    });

    return overlay;
  }

  // ════════════════════════════════════════════════════════
  // TABS
  // ════════════════════════════════════════════════════════
  const TABS = [
    { id:'line',      label:'📈 Line Graph' },
    { id:'bar',       label:'📊 Bar Chart'  },
    { id:'pie',       label:'🥧 Pie Chart'  },
    { id:'scatter',   label:'⚬ Scatter'     },
    { id:'histogram', label:'▦ Histogram'   },
    { id:'stats',     label:'∑ Statistics'  },
  ];

  function buildTabs() {
    const bar = document.getElementById('graph-tabs');
    if (!bar) return;
    bar.innerHTML = '';
    TABS.forEach(t => {
      const btn = document.createElement('button');
      btn.dataset.tab = t.id;
      btn.textContent = t.label;
      btn.style.cssText = `
        padding:10px 18px;border:none;border-bottom:2px solid transparent;
        background:transparent;color:rgba(255,255,255,.5);
        font-size:12.5px;font-weight:500;cursor:pointer;
        white-space:nowrap;flex-shrink:0;
        transition:all .15s;touch-action:manipulation;
        font-family:'Segoe UI',sans-serif;
      `;
      btn.addEventListener('click', () => switchTab(t.id));
      bar.appendChild(btn);
    });
  }

  function switchTab(id) {
    activeTab = id;
    // Update tab styles
    document.querySelectorAll('#graph-tabs button').forEach(b => {
      const isActive = b.dataset.tab === id;
      b.style.color       = isActive ? '#e8c96b' : 'rgba(255,255,255,.5)';
      b.style.borderColor = isActive ? '#c9a84c' : 'transparent';
      b.style.background  = isActive ? 'rgba(201,168,76,.1)' : 'transparent';
    });
    buildControls(id);
    render();
  }

  // ════════════════════════════════════════════════════════
  // CONTROLS PANEL
  // ════════════════════════════════════════════════════════
  function buildControls(tab) {
    const panel = document.getElementById('graph-controls');
    if (!panel) return;

    const css = `
      <style>
        .gc-section { margin-bottom:14px }
        .gc-label { font-size:9.5px;font-weight:700;letter-spacing:.14em;
          text-transform:uppercase;color:#c9a84c;opacity:.75;margin-bottom:6px;display:block }
        .gc-input { width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(201,168,76,.3);
          border-radius:6px;color:#fff;font-size:12px;font-family:'Consolas',monospace;
          padding:7px 9px;outline:none;box-sizing:border-box;resize:vertical }
        .gc-input:focus { border-color:#c9a84c;background:rgba(201,168,76,.08) }
        .gc-row { display:flex;align-items:center;gap:7px;margin-bottom:6px }
        .gc-row label { font-size:11px;color:rgba(255,255,255,.65);min-width:80px }
        .gc-row input[type=text],.gc-row input[type=number] {
          flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.28);
          border-radius:5px;color:#fff;font-size:12px;font-family:'Consolas',monospace;
          padding:5px 8px;outline:none }
        .gc-row input:focus { border-color:#c9a84c }
        .gc-row input[type=color] { width:32px;height:26px;border-radius:4px;
          border:1px solid rgba(201,168,76,.3);background:none;cursor:pointer;padding:1px }
        .gc-checkbox { display:flex;align-items:center;gap:7px;margin-bottom:5px;cursor:pointer }
        .gc-checkbox input { width:16px;height:16px;cursor:pointer;accent-color:#c9a84c }
        .gc-checkbox span { font-size:12px;color:rgba(255,255,255,.7) }
        .gc-btn { width:100%;padding:9px;border-radius:6px;border:1px solid rgba(201,168,76,.4);
          background:rgba(201,168,76,.12);color:#e8c96b;font-size:12px;font-weight:600;
          cursor:pointer;margin-top:6px;font-family:'Segoe UI',sans-serif;touch-action:manipulation }
        .gc-btn:hover,.gc-btn:active { background:rgba(201,168,76,.25) }
        .gc-btn-sm { padding:5px 10px;border-radius:5px;border:1px solid rgba(201,168,76,.3);
          background:rgba(201,168,76,.08);color:#e8c96b;font-size:11px;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation }
        .gc-btn-sm:hover { background:rgba(201,168,76,.2) }
        .gc-dataset { background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
          border-radius:8px;padding:10px;margin-bottom:8px }
      </style>
    `;

    let html = css;

    switch(tab) {

      case 'line':
        html += `
          <div class="gc-section">
            <span class="gc-label">Chart Title</span>

  // ════════════════════════════════════════════════════════
  // STATE UPDATERS
  // ════════════════════════════════════════════════════════
  function updateField(tab, key, val) {
    state[tab][key] = val;
    render();
  }

  function updateDataset(tab, i, key, val) {
    if (state[tab].datasets && state[tab].datasets[i]) {
      state[tab].datasets[i][key] = val;
      render();
    }
  }

  function updatePoints(tab, i, raw) {
    try {
      const pts = raw.trim().split('\n').map(line => {
        const [x, y] = line.split(',').map(Number);
        return (!isNaN(x) && !isNaN(y)) ? {x, y} : null;
      }).filter(Boolean);
      if (pts.length > 0) {
        state[tab].datasets[i].points = pts;
        render();
      }
    } catch(e) {}
  }

  function updateBarLabels(raw) {
    state.bar.labels = raw.split(',').map(s => s.trim());
    render();
  }

  function updateBarValues(i, raw) {
    try {
      const vals = raw.split(',').map(Number).filter(n => !isNaN(n));
      if (vals.length > 0) { state.bar.datasets[i].values = vals; render(); }
    } catch(e) {}
  }

  function updatePieData(raw) {
    const labels = [], values = [];
    raw.trim().split('\n').forEach(line => {
      const parts = line.split(',');
      if (parts.length >= 2) {
        labels.push(parts[0].trim());
        values.push(parseFloat(parts[1]) || 0);
      }
    });
    if (labels.length) { state.pie.labels = labels; state.pie.values = values; render(); }
  }

  function addDataset(tab) {
    const n = (state[tab].datasets||[]).length + 1;
    const color = COLORS[(n-1) % COLORS.length];
    if (tab === 'line' || tab === 'scatter') {
      state[tab].datasets.push({ label:`Series ${n}`, color, points:[{x:1,y:2},{x:2,y:4},{x:3,y:3}] });
    } else if (tab === 'bar') {
      state.bar.datasets.push({ label:`Series ${n}`, color, values:state.bar.labels.map(()=>Math.floor(Math.random()*15+3)) });
    }
    buildControls(tab);
    render();
  }

  // ════════════════════════════════════════════════════════
  // RENDER DISPATCHER
  // ════════════════════════════════════════════════════════
  function render() {
    const canvas = document.getElementById('graph-canvas');
    if (!canvas) return;
    const container = canvas.parentElement;
    canvas.width  = container.clientWidth - 32;
    canvas.height = container.clientHeight - 32 - (document.getElementById('graph-stats-row')?.offsetHeight || 0) - 20;

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    switch(activeTab) {
      case 'line':      renderLine(ctx, canvas); break;
      case 'bar':       renderBar(ctx, canvas);  break;
      case 'pie':       renderPie(ctx, canvas);  break;
      case 'scatter':   renderScatter(ctx, canvas); break;
      case 'histogram': renderHistogram(ctx, canvas); break;
      case 'stats':     renderStats(ctx, canvas); break;
    }
  }

  // ════════════════════════════════════════════════════════
  // SHARED DRAWING HELPERS
  // ════════════════════════════════════════════════════════
  const PAD = { top:50, right:30, bottom:60, left:65 };

  // ════════════════════════════════════════════════════════
  // 4-QUADRANT COORDINATE SYSTEM
  // Draws proper x'y' axes with origin at centre
  // ════════════════════════════════════════════════════════
  function drawAxes4Q(ctx, W, H, xMin, xMax, yMin, yMax, xLabel, yLabel, title, showGrid) {
    const { top:T, right:R, bottom:B, left:L } = PAD;
    const cW = W - L - R, cH = H - T - B;

    // Background
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(L, T, cW, cH);

    // Title
    if (title) {
      ctx.font = '600 14px Segoe UI, sans-serif';
      ctx.fillStyle = '#e8c96b';
      ctx.textAlign = 'center';
      ctx.fillText(title, W/2, T - 18);
    }

    const area = { x:L, y:T, w:cW, h:cH };

    // Origin pixel position
    const ox = toCanvasX(0, xMin, xMax, area);
    const oy = toCanvasY(0, yMin, yMax, area);

    // ── Grid lines ──
    if (showGrid) {
      ctx.save();
      ctx.setLineDash([3, 4]);
      ctx.lineWidth = 1;

      const xSteps = 10, ySteps = 10;
      for (let i = 0; i <= xSteps; i++) {
        const val = xMin + (i / xSteps) * (xMax - xMin);
        const x   = toCanvasX(val, xMin, xMax, area);
        ctx.strokeStyle = val === 0 ? 'rgba(255,255,255,0.0)' : 'rgba(255,255,255,0.07)';
        ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + cH); ctx.stroke();
      }
      for (let i = 0; i <= ySteps; i++) {
        const val = yMin + (i / ySteps) * (yMax - yMin);
        const y   = toCanvasY(val, yMin, yMax, area);
        ctx.strokeStyle = val === 0 ? 'rgba(255,255,255,0.0)' : 'rgba(255,255,255,0.07)';
        ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + cW, y); ctx.stroke();
      }
      ctx.restore();
    }

    // ── Quadrant labels ──
    ctx.font = '600 11px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.textAlign = 'center';
    const qpad = 20;
    if (ox > L + qpad && oy > T + qpad)         ctx.fillText('II', (L + ox) / 2, (T + oy) / 2);
    if (ox < L + cW - qpad && oy > T + qpad)    ctx.fillText('I',  (ox + L + cW) / 2, (T + oy) / 2);
    if (ox > L + qpad && oy < T + cH - qpad)    ctx.fillText('III',(L + ox) / 2, (oy + T + cH) / 2);
    if (ox < L + cW - qpad && oy < T + cH - qpad) ctx.fillText('IV',(ox + L + cW) / 2, (oy + T + cH) / 2);

    // ── Tick marks + value labels ──
    const tickLen = 5;
    ctx.font = '10px Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.setLineDash([]);

    // X-axis ticks
    const xStep = niceStep(xMin, xMax, 10);
    for (let v = Math.ceil(xMin / xStep) * xStep; v <= xMax; v = +(v + xStep).toFixed(10)) {
      const x = toCanvasX(v, xMin, xMax, area);
      if (x < L || x > L + cW) continue;
      ctx.beginPath(); ctx.moveTo(x, oy - tickLen); ctx.lineTo(x, oy + tickLen); ctx.stroke();
      if (Math.abs(v) > 1e-9) {
        ctx.textAlign = 'center';
        ctx.fillText(+v.toFixed(2), x, oy + 16);
      }
    }

    // Y-axis ticks
    const yStep = niceStep(yMin, yMax, 8);
    for (let v = Math.ceil(yMin / yStep) * yStep; v <= yMax; v = +(v + yStep).toFixed(10)) {
      const y = toCanvasY(v, yMin, yMax, area);
      if (y < T || y > T + cH) continue;
      ctx.beginPath(); ctx.moveTo(ox - tickLen, y); ctx.lineTo(ox + tickLen, y); ctx.stroke();
      if (Math.abs(v) > 1e-9) {
        ctx.textAlign = 'right';
        ctx.fillText(+v.toFixed(2), ox - 8, y + 4);
      }
    }

    // Origin label
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textAlign = 'right';
    ctx.fillText('0', ox - 5, oy + 14);

    // ── Main Axes (thick, with arrows) ──
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';

    // X axis (horizontal)
    ctx.beginPath();
    ctx.moveTo(L, oy); ctx.lineTo(L + cW, oy);
    ctx.stroke();
    // X arrow right
    ctx.beginPath();
    ctx.moveTo(L + cW, oy);
    ctx.lineTo(L + cW - 8, oy - 4);
    ctx.lineTo(L + cW - 8, oy + 4);
    ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    // X arrow left (x' direction)
    ctx.beginPath();
    ctx.moveTo(L, oy);
    ctx.lineTo(L + 8, oy - 4);
    ctx.lineTo(L + 8, oy + 4);
    ctx.closePath(); ctx.fill();

    // Y axis (vertical)
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(ox, T); ctx.lineTo(ox, T + cH);
    ctx.stroke();
    // Y arrow up
    ctx.beginPath();
    ctx.moveTo(ox, T);
    ctx.lineTo(ox - 4, T + 8);
    ctx.lineTo(ox + 4, T + 8);
    ctx.closePath(); ctx.fill();
    // Y arrow down (y' direction)
    ctx.beginPath();
    ctx.moveTo(ox, T + cH);
    ctx.lineTo(ox - 4, T + cH - 8);
    ctx.lineTo(ox + 4, T + cH - 8);
    ctx.closePath(); ctx.fill();

    // Axis labels with x', y' notation
    ctx.font = '600 12px Segoe UI, sans-serif';
    ctx.fillStyle = '#e8c96b';
    ctx.textAlign = 'left';
    ctx.fillText(xLabel || 'x →', L + cW + 6, oy + 4);
    ctx.textAlign = 'right';
    ctx.fillText("x' ←", L - 4, oy + 4);
    ctx.textAlign = 'center';
    ctx.fillText(yLabel ? `↑ ${yLabel}` : '↑ y', ox, T - 6);
    ctx.fillText("↓ y'", ox, T + cH + 18);

    return area;
  }

  // Nice round step for axis ticks
  function niceStep(min, max, targetSteps) {
    const range = max - min;
    if (range === 0) return 1;
    const rough = range / targetSteps;
    const mag   = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm  = rough / mag;
    let step = norm < 1.5 ? 1 : norm < 3.5 ? 2 : norm < 7.5 ? 5 : 10;
    return step * mag;
  }

  // Old drawAxes kept for bar/pie/histogram
  function drawAxes(ctx, W, H, xLabel, yLabel, title) {
    const { top:T, right:R, bottom:B, left:L } = PAD;
    const cW = W - L - R, cH = H - T - B;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(L, T, cW, cH);
    if (title) {
      ctx.font = '600 14px Segoe UI, sans-serif';
      ctx.fillStyle = '#e8c96b';
      ctx.textAlign = 'center';
      ctx.fillText(title, W/2, T - 18);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(L, T); ctx.lineTo(L, T + cH); ctx.lineTo(L + cW, T + cH);
    ctx.stroke();
    ctx.font = '12px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.textAlign = 'center';
    ctx.fillText(xLabel || '', W/2, H - 6);
    ctx.save();
    ctx.translate(14, T + cH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(yLabel || '', 0, 0);
    ctx.restore();
    ctx.restore();
    return { x:L, y:T, w:cW, h:cH };
  }

  function drawGrid(ctx, area, xSteps, ySteps, xMin, xMax, yMin, yMax) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    for (let i = 0; i <= xSteps; i++) {
      const x = area.x + (i / xSteps) * area.w;
      ctx.beginPath(); ctx.moveTo(x, area.y); ctx.lineTo(x, area.y + area.h); ctx.stroke();
      const val = xMin + (i / xSteps) * (xMax - xMin);
      ctx.font = '10px Consolas, monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.textAlign = 'center';
      ctx.setLineDash([]);
      ctx.fillText(+val.toFixed(1), x, area.y + area.h + 16);
      ctx.setLineDash([3,4]);
    }
    for (let i = 0; i <= ySteps; i++) {
      const y = area.y + area.h - (i / ySteps) * area.h;
      ctx.beginPath(); ctx.moveTo(area.x, y); ctx.lineTo(area.x + area.w, y); ctx.stroke();
      const val = yMin + (i / ySteps) * (yMax - yMin);
      ctx.font = '10px Consolas, monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.textAlign = 'right';
      ctx.setLineDash([]);
      ctx.fillText(+val.toFixed(1), area.x - 6, y + 4);
      ctx.setLineDash([3,4]);
    }
    ctx.restore();
  }

  function toCanvasX(val, min, max, area) { return area.x + ((val - min) / (max - min)) * area.w; }
  function toCanvasY(val, min, max, area) { return area.y + area.h - ((val - min) / (max - min)) * area.h; }

  function drawLegend(ctx, datasets, W, H) {
    const items = datasets;
    let lx = PAD.left;
    const ly = H - 12;
    ctx.font = '11px Segoe UI, sans-serif';
    items.forEach(ds => {
      ctx.fillStyle = ds.color;
      ctx.fillRect(lx, ly - 8, 14, 8);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.textAlign = 'left';
      ctx.fillText(ds.label, lx + 18, ly);
      lx += ctx.measureText(ds.label).width + 36;
    });
  }

  // ════════════════════════════════════════════════════════
  // LINE GRAPH
  // ════════════════════════════════════════════════════════
  function renderLine(ctx, canvas) {
    const s = state.line;
    const W = canvas.width, H = canvas.height;

    const allX = s.datasets.flatMap(d => d.points.map(p => p.x));
    const allY = s.datasets.flatMap(d => d.points.map(p => p.y));

    // Auto-range: include 0 always, pad by 15%
    const rawXMin = Math.min(...allX), rawXMax = Math.max(...allX);
    const rawYMin = Math.min(...allY), rawYMax = Math.max(...allY);
    const xPad = (rawXMax - rawXMin) * 0.15 || 1;
    const yPad = (rawYMax - rawYMin) * 0.15 || 1;
    const xMin = Math.min(rawXMin - xPad, 0);
    const xMax = Math.max(rawXMax + xPad, 0);
    const yMin = Math.min(rawYMin - yPad, 0);
    const yMax = Math.max(rawYMax + yPad, 0);

    const area = drawAxes4Q(ctx, W, H, xMin, xMax, yMin, yMax, s.xLabel, s.yLabel, s.title, s.showGrid);

    s.datasets.forEach(ds => {
      if (!ds.points.length) return;
      const sorted = [...ds.points].sort((a,b) => a.x - b.x);

      ctx.save();
      ctx.strokeStyle = ds.color;
      ctx.lineWidth   = 2.5;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      ctx.shadowColor = ds.color;
      ctx.shadowBlur  = 6;

      // Fill area under line
      ctx.beginPath();
      sorted.forEach((p, i) => {
        const cx = toCanvasX(p.x, xMin, xMax, area);
        const cy = toCanvasY(p.y, yMin, yMax, area);
        i === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
      });
      const grad = ctx.createLinearGradient(0, area.y, 0, area.y + area.h);
      grad.addColorStop(0, ds.color + '40');
      grad.addColorStop(1, ds.color + '05');
      ctx.lineTo(toCanvasX(sorted[sorted.length-1].x, xMin, xMax, area), area.y + area.h);
      ctx.lineTo(toCanvasX(sorted[0].x, xMin, xMax, area), area.y + area.h);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.shadowBlur = 0;
      ctx.fill();

      // Line
      ctx.beginPath();
      ctx.shadowBlur = 6;
      if (s.smooth && sorted.length > 2) {
        ctx.moveTo(toCanvasX(sorted[0].x,xMin,xMax,area), toCanvasY(sorted[0].y,yMin,yMax,area));
        for (let i = 1; i < sorted.length - 1; i++) {
          const cx1 = toCanvasX((sorted[i-1].x+sorted[i].x)/2, xMin,xMax,area);
          const cy1 = toCanvasY((sorted[i-1].y+sorted[i].y)/2, yMin,yMax,area);
          const cx2 = toCanvasX((sorted[i].x+sorted[i+1].x)/2, xMin,xMax,area);
          const cy2 = toCanvasY((sorted[i].y+sorted[i+1].y)/2, yMin,yMax,area);
          ctx.quadraticCurveTo(toCanvasX(sorted[i].x,xMin,xMax,area), toCanvasY(sorted[i].y,yMin,yMax,area), (cx2+cx1)/2, (cy2+cy1)/2);
        }
      } else {
        sorted.forEach((p, i) => {
          const cx = toCanvasX(p.x, xMin, xMax, area);
          const cy = toCanvasY(p.y, yMin, yMax, area);
          i === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
        });
      }
      ctx.stroke();

      // Points
      if (s.showPoints) {
        sorted.forEach(p => {
          const cx = toCanvasX(p.x, xMin, xMax, area);
          const cy = toCanvasY(p.y, yMin, yMax, area);
          ctx.shadowBlur = 8;
          ctx.fillStyle  = ds.color;
          ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle  = '#fff';
          ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI*2); ctx.fill();
          // Value label
          ctx.fillStyle  = 'rgba(255,255,255,0.8)';
          ctx.font       = '10px Consolas, monospace';
          ctx.textAlign  = 'center';
          ctx.fillText(p.y, cx, cy - 10);
        });
      }
      ctx.restore();
    });

    drawLegend(ctx, s.datasets, W, H);
  }

  // ════════════════════════════════════════════════════════
  // BAR CHART
  // ════════════════════════════════════════════════════════
  function renderBar(ctx, canvas) {
    const s = state.bar;
    const W = canvas.width, H = canvas.height;
    const allVals = s.datasets.flatMap(d => d.values);
    const yMax = Math.max(...allVals) * 1.2 || 10;
    const area  = drawAxes(ctx, W, H, s.xLabel, s.yLabel, s.title);
    drawGrid(ctx, area, s.labels.length, 5, 0, s.labels.length, 0, yMax);

    const nGroups  = s.labels.length;
    const nSeries  = s.datasets.length;
    const groupW   = area.w / nGroups;
    const barW     = Math.min((groupW * 0.8) / nSeries, 60);
    const groupGap = (groupW - barW * nSeries) / 2;

    s.datasets.forEach((ds, si) => {
      ds.values.forEach((val, gi) => {
        if (gi >= nGroups) return;
        const bH  = (val / yMax) * area.h;
        const bX  = area.x + gi * groupW + groupGap + si * barW;
        const bY  = area.y + area.h - bH;

        const grad = ctx.createLinearGradient(bX, bY, bX, area.y + area.h);
        grad.addColorStop(0, ds.color);
        grad.addColorStop(1, ds.color + '88');
        ctx.fillStyle = grad;

        // Rounded top bar
        ctx.beginPath();
        const r = Math.min(4, barW/3);
        ctx.moveTo(bX + r, bY);
        ctx.lineTo(bX + barW - r, bY);
        ctx.arcTo(bX + barW, bY, bX + barW, bY + r, r);
        ctx.lineTo(bX + barW, area.y + area.h);
        ctx.lineTo(bX, area.y + area.h);
        ctx.lineTo(bX, bY + r);
        ctx.arcTo(bX, bY, bX + r, bY, r);
        ctx.closePath();
        ctx.fill();

        // Value label on top
        ctx.fillStyle  = 'rgba(255,255,255,0.8)';
        ctx.font       = '10px Consolas, monospace';
        ctx.textAlign  = 'center';
        ctx.fillText(val, bX + barW/2, bY - 4);
      });
    });

    // X-axis category labels
    ctx.font = '11px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.textAlign = 'center';
    s.labels.forEach((lbl, i) => {
      ctx.fillText(lbl, area.x + i * groupW + groupW/2, area.y + area.h + 18);
    });

    // Y-axis value labels
    for (let i = 0; i <= 5; i++) {
      const y = area.y + area.h - (i/5) * area.h;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.textAlign = 'right';
      ctx.font = '10px Consolas, monospace';
      ctx.fillText(+(i/5*yMax).toFixed(1), area.x - 6, y + 4);
    }

    drawLegend(ctx, s.datasets, W, H);
  }

  // ════════════════════════════════════════════════════════
  // PIE / DONUT CHART
  // ════════════════════════════════════════════════════════
  function renderPie(ctx, canvas) {
    const s   = state.pie;
    const W   = canvas.width, H = canvas.height;
    const cx  = W/2, cy  = H/2 - 10;
    const r   = Math.min(W, H) * 0.33;
    const ir  = s.donut ? r * 0.5 : 0;
    const total = s.values.reduce((a,b) => a+b, 0) || 1;

    // Title
    ctx.font = '600 14px Segoe UI, sans-serif';
    ctx.fillStyle = '#e8c96b';
    ctx.textAlign = 'center';
    ctx.fillText(s.title, W/2, 28);

    let startAngle = -Math.PI/2;
    s.values.forEach((val, i) => {
      const slice = (val / total) * 2 * Math.PI;
      const color = COLORS[i % COLORS.length];
      const mid   = startAngle + slice/2;

      // Slight explode
      const explode = 4;
      const ox = Math.cos(mid) * explode;
      const oy = Math.sin(mid) * explode;

      ctx.beginPath();
      ctx.moveTo(cx + ox, cy + oy);
      ctx.arc(cx + ox, cy + oy, r, startAngle, startAngle + slice);
      if (ir > 0) ctx.arc(cx + ox, cy + oy, ir, startAngle + slice, startAngle, true);
      else ctx.lineTo(cx + ox, cy + oy);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(5,10,20,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Percentage label
      const labelR = r * (s.donut ? 0.75 : 0.65);
      const lx = cx + ox + Math.cos(mid) * labelR;
      const ly = cy + oy + Math.sin(mid) * labelR;
      const pct = (val/total*100).toFixed(1);
      ctx.fillStyle = '#fff';
      ctx.font = '600 11px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (slice > 0.2) ctx.fillText(`${pct}%`, lx, ly);
      ctx.textBaseline = 'alphabetic';

      startAngle += slice;
    });

    // Donut centre text
    if (s.donut) {
      ctx.fillStyle = '#e8c96b';
      ctx.font = '700 18px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(total, cx, cy);
      ctx.font = '11px Segoe UI, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fillText('Total', cx, cy + 18);
      ctx.textBaseline = 'alphabetic';
    }

    // Legend
    const legendY = H - 20;
    let lx = 20;
    s.labels.forEach((lbl, i) => {
      const color = COLORS[i % COLORS.length];
      ctx.fillStyle = color;
      ctx.fillRect(lx, legendY - 10, 12, 10);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.font = '11px Segoe UI, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${lbl} (${s.values[i]})`, lx + 16, legendY);
      lx += ctx.measureText(`${lbl} (${s.values[i]})`).width + 32;
      if (lx > W - 80) lx = 20;
    });
  }

  // ════════════════════════════════════════════════════════
  // SCATTER PLOT
  // ════════════════════════════════════════════════════════
  function renderScatter(ctx, canvas) {
    const s = state.scatter;
    const W = canvas.width, H = canvas.height;
    const allX = s.datasets.flatMap(d => d.points.map(p => p.x));
    const allY = s.datasets.flatMap(d => d.points.map(p => p.y));
    const rawXMin = Math.min(...allX), rawXMax = Math.max(...allX);
    const rawYMin = Math.min(...allY), rawYMax = Math.max(...allY);
    const xPad = (rawXMax - rawXMin) * 0.15 || 1;
    const yPad = (rawYMax - rawYMin) * 0.15 || 1;
    const xMin = Math.min(rawXMin - xPad, 0);
    const xMax = Math.max(rawXMax + xPad, 0);
    const yMin = Math.min(rawYMin - yPad, 0);
    const yMax = Math.max(rawYMax + yPad, 0);
    const area = drawAxes4Q(ctx, W, H, xMin, xMax, yMin, yMax, s.xLabel, s.yLabel, s.title, true);

    s.datasets.forEach(ds => {
      // Trendline (linear regression)
      if (s.showTrendline && ds.points.length > 1) {
        const n  = ds.points.length;
        const sx = ds.points.reduce((a,p) => a+p.x, 0);
        const sy = ds.points.reduce((a,p) => a+p.y, 0);
        const sx2= ds.points.reduce((a,p) => a+p.x*p.x, 0);
        const sxy= ds.points.reduce((a,p) => a+p.x*p.y, 0);
        const m  = (n*sxy - sx*sy) / (n*sx2 - sx*sx);
        const b  = (sy - m*sx) / n;
        ctx.save();
        ctx.strokeStyle = ds.color + 'aa';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6,4]);
        ctx.beginPath();
        ctx.moveTo(toCanvasX(xMin,xMin,xMax,area), toCanvasY(m*xMin+b,yMin,yMax,area));
        ctx.lineTo(toCanvasX(xMax,xMin,xMax,area), toCanvasY(m*xMax+b,yMin,yMax,area));
        ctx.stroke();
        ctx.restore();
        // R² label
        const ss_tot = ds.points.reduce((a,p) => a+(p.y-sy/n)**2, 0);
        const ss_res = ds.points.reduce((a,p) => a+(p.y-(m*p.x+b))**2, 0);
        const r2 = 1 - ss_res/ss_tot;
        ctx.font = '10px Consolas, monospace';
        ctx.fillStyle = ds.color;
        ctx.textAlign = 'right';
        ctx.fillText(`R²=${r2.toFixed(3)}  y=${m.toFixed(2)}x+${b.toFixed(2)}`, area.x+area.w, area.y+12);
      }

      // Points
      ds.points.forEach(p => {
        const cx2 = toCanvasX(p.x, xMin, xMax, area);
        const cy2 = toCanvasY(p.y, yMin, yMax, area);
        ctx.fillStyle = ds.color;
        ctx.shadowColor = ds.color;
        ctx.shadowBlur  = 6;
        ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle  = '#fff';
        ctx.beginPath(); ctx.arc(cx2, cy2, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle  = 'rgba(255,255,255,.65)';
        ctx.font = '9px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`(${p.x},${p.y})`, cx2, cy2 - 10);
      });
    });

    drawLegend(ctx, s.datasets, W, H);
  }

  // ════════════════════════════════════════════════════════
  // HISTOGRAM
  // ════════════════════════════════════════════════════════
  function renderHistogram(ctx, canvas) {
    const s = state.histogram;
    const W = canvas.width, H = canvas.height;

    const raw  = s.rawData.split(',').map(Number).filter(n => !isNaN(n));
    if (!raw.length) return;

    const mn   = Math.min(...raw), mx = Math.max(...raw);
    const binW = (mx - mn) / s.bins;
    const bins = Array(s.bins).fill(0);
    raw.forEach(v => {
      const i = Math.min(Math.floor((v - mn) / binW), s.bins - 1);
      bins[i]++;
    });

    const yMax = Math.max(...bins) * 1.2 || 1;
    const area = drawAxes(ctx, W, H, s.xLabel, s.yLabel, s.title);
    drawGrid(ctx, area, s.bins, 5, 0, s.bins, 0, yMax);

    const bW = area.w / s.bins;
    bins.forEach((freq, i) => {
      const bH  = (freq / yMax) * area.h;
      const bX  = area.x + i * bW;
      const bY  = area.y + area.h - bH;
      const hue = 200 + i * (60/s.bins);

      const grad = ctx.createLinearGradient(bX, bY, bX, area.y + area.h);
      grad.addColorStop(0, `hsla(${hue},75%,60%,0.9)`);
      grad.addColorStop(1, `hsla(${hue},75%,40%,0.5)`);
      ctx.fillStyle = grad;
      ctx.fillRect(bX + 1, bY, bW - 2, bH);

      // Frequency label
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.font = '11px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(freq, bX + bW/2, bY - 4);

      // Interval label
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.font = '9.5px Consolas, monospace';
      ctx.fillText(`${(mn+i*binW).toFixed(1)}-${(mn+(i+1)*binW).toFixed(1)}`, bX + bW/2, area.y + area.h + 18);
    });

    // Stats panel
    const mean   = raw.reduce((a,b)=>a+b,0)/raw.length;
    const sorted = [...raw].sort((a,b)=>a-b);
    const median = sorted.length%2===0 ? (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2 : sorted[Math.floor(sorted.length/2)];
    const sd     = Math.sqrt(raw.reduce((a,b)=>a+(b-mean)**2,0)/raw.length);
    const statsEl = document.getElementById('histogram-stats');
    if (statsEl) statsEl.innerHTML =
      `n = ${raw.length}  |  Min = ${mn}  |  Max = ${mx}  |  Mean = ${mean.toFixed(3)}  |  Median = ${median}  |  SD = ${sd.toFixed(3)}`;
  }

  // ════════════════════════════════════════════════════════
  // STATISTICS DASHBOARD
  // ════════════════════════════════════════════════════════
  function renderStats(ctx, canvas) {
    const s = state.stats;
    const W = canvas.width, H = canvas.height;

    const raw    = s.data.split(',').map(Number).filter(n => !isNaN(n));
    if (!raw.length) return;

    const sorted = [...raw].sort((a,b) => a-b);
    const n      = raw.length;
    const sum    = raw.reduce((a,b) => a+b, 0);
    const mean   = sum / n;
    const mid    = Math.floor(n/2);
    const median = n%2===0 ? (sorted[mid-1]+sorted[mid])/2 : sorted[mid];
    const freq   = {};
    raw.forEach(v => freq[v] = (freq[v]||0)+1);
    const maxF   = Math.max(...Object.values(freq));
    const mode   = Object.keys(freq).filter(k => freq[k]===maxF).map(Number);
    const range  = sorted[n-1] - sorted[0];
    const vari   = raw.reduce((a,b) => a+(b-mean)**2, 0) / n;
    const sd     = Math.sqrt(vari);
    const q1     = sorted[Math.floor(n/4)];
    const q3     = sorted[Math.floor(3*n/4)];

    // Stats cards
    const CARDS = [
      { label:'Count (n)',    val: n,               color:'#4e9af1' },
      { label:'Sum',         val: sum.toFixed(2),   color:'#f1a94e' },
      { label:'Mean (x̄)',    val: mean.toFixed(4),  color:'#4ef17a' },
      { label:'Median',      val: median,           color:'#f14e8a' },
      { label:'Mode',        val: mode.join(', '),  color:'#a94ef1' },
      { label:'Range',       val: range,            color:'#4ef1e8' },
      { label:'Variance',    val: vari.toFixed(4),  color:'#f1e84e' },
      { label:'Std Dev (σ)', val: sd.toFixed(4),    color:'#f14e4e' },
      { label:'Q1',          val: q1,               color:'#4e9af1' },
      { label:'Q3',          val: q3,               color:'#f1a94e' },
      { label:'IQR',         val: q3-q1,            color:'#4ef17a' },
      { label:'Min',         val: sorted[0],        color:'#4ef1e8' },
      { label:'Max',         val: sorted[n-1],      color:'#f14e8a' },
    ];

    const cols = 4;
    const cardW = W / cols - 12;
    const cardH = 56;
    const startY = 40;

    ctx.font = '600 14px Segoe UI, sans-serif';
    ctx.fillStyle = '#e8c96b';
    ctx.textAlign = 'center';
    ctx.fillText('Statistics Dashboard', W/2, 22);

    CARDS.forEach((card, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx  = col * (cardW + 12) + 6;
      const cy  = startY + row * (cardH + 8);

      // Card background
      ctx.fillStyle = card.color + '18';
      ctx.strokeStyle = card.color + '55';
      ctx.lineWidth = 1.5;
      if (ctx.roundRect) ctx.roundRect(cx, cy, cardW, cardH, 7);
      else ctx.rect(cx, cy, cardW, cardH);
      ctx.fill(); ctx.stroke();

      // Label
      ctx.fillStyle = card.color;
      ctx.font = '600 10px Segoe UI, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(card.label, cx+10, cy+16);

      // Value
      ctx.fillStyle = '#fff';
      ctx.font = '700 18px Consolas, monospace';
      ctx.fillText(String(card.val), cx+10, cy+42);
    });

    // Box plot
    const bpY  = startY + Math.ceil(CARDS.length/cols) * (cardH+8) + 20;
    const bpH  = Math.min(60, H - bpY - 40);
    if (bpY + bpH + 30 < H) {
      const bpMn = sorted[0], bpMx = sorted[n-1];
      const bpRange = bpMx - bpMn || 1;
      const toX = v => 40 + ((v-bpMn)/bpRange) * (W-80);
      const midY = bpY + bpH/2;

      ctx.fillStyle = 'rgba(201,168,76,0.6)';
      ctx.font = '600 10px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Box & Whisker Plot', W/2, bpY-6);

      ctx.strokeStyle = '#4e9af1';
      ctx.lineWidth = 2;
      // Whiskers
      ctx.beginPath(); ctx.moveTo(toX(bpMn),midY); ctx.lineTo(toX(q1),midY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(toX(q3),midY); ctx.lineTo(toX(bpMx),midY); ctx.stroke();
      // Whisker ends
      [bpMn,bpMx].forEach(v => {
        ctx.beginPath();
        ctx.moveTo(toX(v),midY-8); ctx.lineTo(toX(v),midY+8); ctx.stroke();
      });
      // IQR box
      ctx.fillStyle = 'rgba(78,154,241,0.25)';
      ctx.fillRect(toX(q1), midY-bpH/2, toX(q3)-toX(q1), bpH);
      ctx.strokeRect(toX(q1), midY-bpH/2, toX(q3)-toX(q1), bpH);
      // Median line
      ctx.strokeStyle = '#f1a94e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(toX(median),midY-bpH/2); ctx.lineTo(toX(median),midY+bpH/2); ctx.stroke();
      // Labels
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '9px Consolas, monospace';
      [[bpMn,'Min'],[q1,'Q1'],[median,'Med'],[q3,'Q3'],[bpMx,'Max']].forEach(([v,l]) => {
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        ctx.textAlign = 'center';
        ctx.fillText(v, toX(v), midY+bpH/2+14);
        ctx.fillStyle = 'rgba(201,168,76,.7)';
        ctx.fillText(l, toX(v), bpY+bpH+28);
      });
    }

    // Update stats row below chart
    const row = document.getElementById('graph-stats-row');
    if (row) {
      row.innerHTML = [
        `Mean = <b style="color:#4ef17a">${mean.toFixed(3)}</b>`,
        `Median = <b style="color:#f14e8a">${median}</b>`,
        `Mode = <b style="color:#a94ef1">${mode.join(', ')}</b>`,
        `SD = <b style="color:#f14e4e">${sd.toFixed(3)}</b>`,
        `IQR = <b style="color:#4ef1e8">${q3-q1}</b>`,
      ].map(t => `<span style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
        border-radius:6px;padding:5px 12px;font-size:12px;color:rgba(255,255,255,.75)">${t}</span>`).join('');
    }
  }

  // ════════════════════════════════════════════════════════
  // PUBLIC
  // ════════════════════════════════════════════════════════
  return {
    show, hide, toggle, render, switchTab,
    updateField, updateDataset, updatePoints,
    updateBarLabels, updateBarValues, updatePieData,
    addDataset,
  };
})();

// Make GraphEngine available globally for inline event handlers
window.GraphEngine = GraphEngine;

</script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// PRESENTATION LIBRARY MANAGER
// Save, load, rename, delete, preview presentations
// Stored as .mbp files in Documents/PiyushDhara MathBoard/
// ═══════════════════════════════════════════════════════════

const Library = (() => {

  let visible = false;
  let currentList = [];

  // ════════════════════════════════════════════════════════
  // SHOW / HIDE
  // ════════════════════════════════════════════════════════
  function show() {
    visible = true;
    let overlay = document.getElementById('library-overlay');
    if (!overlay) overlay = buildOverlay();
    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.opacity = '1'; }, 10);
    refreshList();
  }

  function hide() {
    visible = false;
    const overlay = document.getElementById('library-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.display = 'none'; }, 280);
    }
  }

  function toggle() { visible ? hide() : show(); }

  // ════════════════════════════════════════════════════════
  // BUILD OVERLAY
  // ════════════════════════════════════════════════════════
  function buildOverlay() {
    const overlay = document.createElement('div');
    overlay.id = 'library-overlay';
    overlay.style.cssText = `
      position:fixed; inset:0; z-index:2000;

      display:flex; flex-direction:column;
      opacity:0; transition:opacity .28s ease;
      font-family:'Segoe UI',system-ui,sans-serif;
    `;

    overlay.innerHTML = `
      <!-- Header -->
      <div style="display:flex;align-items:center;gap:12px;padding:12px 18px;
        background:linear-gradient(90deg,#060e1c,#101d3a,#060e1c);
        border-bottom:1.5px solid #c9a84c;flex-shrink:0">
        <img src="../assets/logo.png" style="height:36px;width:36px;object-fit:contain;
          filter:drop-shadow(0 0 6px rgba(201,168,76,.5))">
        <div>
          <div style="font-family:Georgia,serif;font-size:16px;font-weight:700;
            color:#e8c96b;letter-spacing:.06em">Presentation Library</div>
          <div style="font-size:9px;color:#c9a84c;letter-spacing:.18em;
            text-transform:uppercase;opacity:.7">PiyushDhara EduVerse · MathBoard</div>
        </div>
        <div style="flex:1"></div>
        <!-- Save current as new -->
        <button id="lib-save-new" style="
          padding:9px 18px;border-radius:7px;
          border:1.5px solid rgba(34,197,94,.5);
          background:rgba(34,197,94,.12);color:#86efac;
          font-size:13px;font-weight:600;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation;
          display:flex;align-items:center;gap:7px">
          <svg viewBox="0 0 18 18" fill="none" style="width:15px;height:15px">
            <path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Save Current as Presentation
        </button>
        <button id="lib-open-folder" style="
          padding:9px 14px;border-radius:7px;
          border:1px solid rgba(201,168,76,.3);
          background:rgba(201,168,76,.08);color:#c9a84c;
          font-size:12px;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation">
          📁 Open Folder
        </button>
        <button id="lib-close" style="
          padding:9px 16px;border-radius:7px;
          border:1px solid rgba(239,68,68,.4);
          background:rgba(239,68,68,.1);color:#fca5a5;
          font-size:13px;font-weight:600;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation">
          ✕ Close
        </button>
      </div>

      <!-- Search + Filter bar -->
      <div style="display:flex;align-items:center;gap:10px;padding:10px 18px;
        background:#080f1f;border-bottom:1px solid rgba(201,168,76,.12);flex-shrink:0">
        <svg viewBox="0 0 20 20" fill="none" style="width:16px;height:16px;color:rgba(255,255,255,.4);flex-shrink:0">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
          <path d="M15 15l-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="lib-search" placeholder="Search presentations…" style="
          flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.25);
          border-radius:6px;color:#fff;font-size:13px;padding:7px 11px;outline:none;
          font-family:'Segoe UI',sans-serif">
        <span id="lib-count" style="font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap"></span>
      </div>

      <!-- Main content -->
      <div style="flex:1;display:flex;overflow:hidden">

        <!-- Presentation grid -->
        <div style="flex:1;overflow-y:auto;padding:18px">
          <div id="lib-grid" style="display:grid;
            grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
            gap:14px">
          </div>
          <div id="lib-empty" style="display:none;text-align:center;padding:60px 20px;
            color:rgba(255,255,255,.3)">
            <div style="font-size:48px;margin-bottom:14px">📚</div>
            <div style="font-size:16px;font-weight:600;margin-bottom:8px">No presentations yet</div>
            <div style="font-size:13px">Click "Save Current as Presentation" to save your first lesson</div>
          </div>
        </div>

      </div>

      <!-- Save dialog (hidden by default) -->
      <div id="lib-save-dialog" style="
        display:none;position:fixed;inset:0;z-index:3000;
        background:rgba(0,0,0,.7);align-items:center;justify-content:center">
        <div style="background:#0d1b38;border:1.5px solid #c9a84c;border-radius:12px;
          padding:28px;width:420px;max-width:90vw;font-family:'Segoe UI',sans-serif">
          <div style="font-family:Georgia,serif;font-size:16px;color:#e8c96b;
            font-weight:700;margin-bottom:18px">Save Presentation</div>
          <div style="margin-bottom:12px">
            <label style="font-size:11px;color:rgba(255,255,255,.55);
              letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px">

            </label>
            <input id="lib-save-name" placeholder="e.g. Chapter 5 - Area and Volume" style="
              width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(201,168,76,.4);

              Subject / Notes (optional)
            </label>
            <input id="lib-save-subject" placeholder="e.g. Class 10 SEE — Mensuration" style="
              width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.25);
              border-radius:7px;color:#fff;font-size:13px;padding:9px 12px;outline:none;
              font-family:'Segoe UI',sans-serif;box-sizing:border-box">
          </div>
          <div style="display:flex;gap:10px">
            <button id="lib-save-confirm" style="
              flex:1;padding:11px;border-radius:7px;
              border:1.5px solid rgba(34,197,94,.5);
              background:rgba(34,197,94,.15);color:#86efac;
              font-size:14px;font-weight:600;cursor:pointer;
              font-family:'Segoe UI',sans-serif;touch-action:manipulation">
              💾 Save
            </button>
            <button id="lib-save-cancel" style="
              padding:11px 18px;border-radius:7px;
              border:1px solid rgba(255,255,255,.15);
              background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);
              font-size:13px;cursor:pointer;
              font-family:'Segoe UI',sans-serif;touch-action:manipulation">
              Cancel
            </button>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);
    wireOverlayEvents();
    return overlay;
  }

  // ════════════════════════════════════════════════════════
  // WIRE EVENTS
  // ════════════════════════════════════════════════════════
  function wireOverlayEvents() {
    document.getElementById('lib-close').addEventListener('click', hide);
    document.getElementById('lib-save-new').addEventListener('click', () => openSaveDialog());
    const folderBtn = document.getElementById('lib-open-folder');
    if (folderBtn) folderBtn.style.display = 'none'; // not needed with localStorage
    document.getElementById('lib-search').addEventListener('input', function() {
      filterList(this.value);
    });
    document.getElementById('lib-save-confirm').addEventListener('click', confirmSave);
    document.getElementById('lib-save-cancel').addEventListener('click', closeSaveDialog);

    // Enter key in save name
    document.getElementById('lib-save-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmSave();
      e.stopPropagation();
    });
    document.getElementById('lib-save-subject').addEventListener('keydown', e => {
      e.stopPropagation();
    });
    document.getElementById('lib-search').addEventListener('keydown', e => {
      e.stopPropagation();
    });
  }

  // ════════════════════════════════════════════════════════
  // LIST
  // ════════════════════════════════════════════════════════
  function renderList(list) {
    const grid  = document.getElementById('lib-grid');
    const empty = document.getElementById('lib-empty');
    const count = document.getElementById('lib-count');
    if (!grid) return;

    count.textContent = `${list.length} presentation${list.length !== 1 ? 's' : ''}`;

    if (!list.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = '';
    list.forEach(pres => {
      const card = buildCard(pres);
      grid.appendChild(card);
    });
  }

  function filterList(query) {
    const q = query.toLowerCase().trim();
    if (!q) { renderList(currentList); return; }
    renderList(currentList.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.subject || '').toLowerCase().includes(q)
    ));
  }

  function showEmpty(msg) {
    const empty = document.getElementById('lib-empty');
    if (empty) {
      empty.style.display = 'block';
      empty.innerHTML = `<div style="font-size:48px;margin-bottom:14px">📚</div>
        <div style="font-size:15px;color:rgba(255,255,255,.4)">${msg}</div>`;
    }
  }

  // ════════════════════════════════════════════════════════
  // CARD
  // ════════════════════════════════════════════════════════
  function buildCard(pres) {
    const card = document.createElement('div');
    card.style.cssText = `
      background:rgba(255,255,255,.04);
      border:1px solid rgba(201,168,76,.2);
      border-radius:10px;padding:16px;
      cursor:pointer;transition:all .18s;
      display:flex;flex-direction:column;gap:10px;
      touch-action:manipulation;
    `;

    const date = pres.savedAt ? new Date(pres.savedAt).toLocaleDateString('en-GB', {
      day:'2-digit', month:'short', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    }) : 'Just saved';

    card.innerHTML = `
      <!-- Preview thumbnail area -->
      <div style="height:120px;background:rgba(10,31,10,.6);border-radius:7px;
        display:flex;align-items:center;justify-content:center;
        border:1px solid rgba(201,168,76,.1);position:relative;overflow:hidden">
        <div style="text-align:center">
          <div style="font-size:32px;margin-bottom:6px">📋</div>
          <div style="font-size:11px;color:rgba(255,255,255,.4)">
            ${pres.pageCount} page${pres.pageCount !== 1 ? 's' : ''}
          </div>
        </div>
        <!-- Open button overlay -->
        <div class="card-open-overlay" style="
          position:absolute;inset:0;background:rgba(201,168,76,.15);
          display:flex;align-items:center;justify-content:center;
          opacity:0;transition:opacity .18s;border-radius:7px">
          <span style="font-size:14px;font-weight:700;color:#e8c96b">▶ Open</span>
        </div>
      </div>

      <!-- Info -->
      <div>
        <div style="font-size:14px;font-weight:600;color:#fff;
          margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${pres.name}">${pres.name}</div>
        <div style="font-size:11px;color:rgba(255,255,255,.45)">${pres.subject || 'MathBoard Presentation'}</div>
        <div style="font-size:10px;color:rgba(201,168,76,.5);margin-top:4px">
          🕐 ${date}
        </div>
      </div>

      <!-- Actions -->
      <div style="display:flex;gap:6px;margin-top:auto">
        <button class="card-open" style="
          flex:1;padding:7px;border-radius:6px;
          border:1px solid rgba(34,197,94,.4);
          background:rgba(34,197,94,.1);color:#86efac;
          font-size:12px;font-weight:600;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation">
          ▶ Open
        </button>
        <button class="card-overwrite" title="Overwrite with current board" style="
          padding:7px 10px;border-radius:6px;
          border:1px solid rgba(201,168,76,.3);
          background:rgba(201,168,76,.08);color:#c9a84c;
          font-size:12px;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation">
          💾
        </button>
        <button class="card-rename" title="Rename" style="
          padding:7px 10px;border-radius:6px;
          border:1px solid rgba(99,102,241,.3);
          background:rgba(99,102,241,.08);color:#a5b4fc;
          font-size:12px;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation">
          ✏️
        </button>
        <button class="card-delete" title="Delete" style="
          padding:7px 10px;border-radius:6px;
          border:1px solid rgba(239,68,68,.3);
          background:rgba(239,68,68,.08);color:#fca5a5;
          font-size:12px;cursor:pointer;
          font-family:'Segoe UI',sans-serif;touch-action:manipulation">
          🗑
        </button>
      </div>
    `;

    // Hover effect
    card.addEventListener('mouseenter', () => {
      card.style.borderColor = 'rgba(201,168,76,.5)';
      card.style.background  = 'rgba(255,255,255,.07)';
      card.style.transform   = 'translateY(-2px)';
      card.style.boxShadow   = '0 6px 24px rgba(0,0,0,.4)';
      card.querySelector('.card-open-overlay').style.opacity = '1';
    });
    card.addEventListener('mouseleave', () => {
      card.style.borderColor = 'rgba(201,168,76,.2)';
      card.style.background  = 'rgba(255,255,255,.04)';
      card.style.transform   = '';
      card.style.boxShadow   = '';
      card.querySelector('.card-open-overlay').style.opacity = '0';
    });

    // Touch
    card.addEventListener('touchstart', () => {
      card.style.borderColor = 'rgba(201,168,76,.5)';
      card.style.background  = 'rgba(255,255,255,.07)';
    }, { passive:true });

    // Open (thumbnail click or open button)
    const openFn = () => openPresentation(pres);
    card.querySelector('.card-open-overlay').addEventListener('click', openFn);
    card.querySelector('.card-open').addEventListener('click', e => { e.stopPropagation(); openFn(); });

    // Overwrite
    card.querySelector('.card-overwrite').addEventListener('click', e => {
      e.stopPropagation();
      overwritePresentation(pres);
    });

    // Rename
    card.querySelector('.card-rename').addEventListener('click', e => {
      e.stopPropagation();
      renamePresentation(pres);
    });

    // Delete
    card.querySelector('.card-delete').addEventListener('click', e => {
      e.stopPropagation();
      deletePresentation(pres);
    });

    return card;
  }

  // ════════════════════════════════════════════════════════
  // SAVE DIALOG
  // ════════════════════════════════════════════════════════
  function openSaveDialog(existingName) {
    const dlg  = document.getElementById('lib-save-dialog');
    const name = document.getElementById('lib-save-name');
    const subj = document.getElementById('lib-save-subject');
    if (!dlg) return;
    name.value = (typeof existingName === 'string' && existingName) ? existingName : suggestName();
    subj.value = '';
    name.style.borderColor = '';
    dlg.style.display = 'flex';
    setTimeout(() => { name.focus(); name.select(); }, 80);
  }

  function closeSaveDialog() {
    const dlg = document.getElementById('lib-save-dialog');
    if (dlg) dlg.style.display = 'none';
  }

  function suggestName() {
    try {
      const ch = (typeof CHAPTERS !== 'undefined') ? CHAPTERS.find(c => c.id === App.activeChapter) : null;
      const d  = new Date();
      const ds = `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear()}`;
      return ch ? `${ch.name} — ${ds}` : `Lesson — ${ds}`;
    } catch(e) {
      return `Lesson — ${new Date().toLocaleDateString()}`;
    }
  }

  // ── Storage helpers (localStorage — stored inside app) ──
  const STORE_KEY = 'piyushdhara_library';

  function storageGetAll() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    } catch(e) { return {}; }
  }

  function storageSave(id, data) {
    try {
      // Strip ImageData (drawData) from pages — cannot be serialized to JSON
      // Only shapes are saved; freehand drawing is not preserved in library
      const serializable = {
        ...data,
        pages: (data.pages || []).map(pg => ({
          id:       pg.id,
          label:    pg.label,
          shapes:   pg.shapes || [],
          drawData: null,   // ImageData cannot be JSON-serialized
        }))
      };
      const all = storageGetAll();
      all[id]   = serializable;
      const json = JSON.stringify(all);
      localStorage.setItem(STORE_KEY, json);
      return true;
    } catch(e) {
      console.error('Storage save failed:', e);
      return false;
    }
  }

  function storageDelete(id) {
    try {
      const all = storageGetAll();
      delete all[id];
      localStorage.setItem(STORE_KEY, JSON.stringify(all));
      return true;
    } catch(e) { return false; }
  }

  function confirmSave() {
    const nameInput = document.getElementById('lib-save-name');
    const subjInput = document.getElementById('lib-save-subject');
    const name      = nameInput?.value.trim();

    if (!name) {
      if (nameInput) { nameInput.style.borderColor = '#ef4444'; nameInput.focus(); }
      return;
    }

    try {
      App.saveCurrent();
      const state   = App.getBoardState();
      state.name    = name;
      state.subject = subjInput?.value.trim() || '';
      state.savedAt = new Date().toISOString();
      state.version = '2.0';

      const id = 'pres_' + Date.now();
      const ok = storageSave(id, state);

      if (ok) {
        closeSaveDialog();
        refreshList();
        App.showToast(`✓ Saved: "${name}"`);
      } else {
        App.showToast('❌ Save failed — check console for details');
      }
    } catch(err) {
      console.error('confirmSave error:', err);
      App.showToast('❌ Error: ' + err.message);
    }
  }

  // ════════════════════════════════════════════════════════
  // LIST
  // ════════════════════════════════════════════════════════
  function refreshList() {
    const all  = storageGetAll();
    currentList = Object.entries(all).map(([id, data]) => ({
      id,
      name:      data.name      || id,
      subject:   data.subject   || '',
      pageCount: (data.pages    || []).length,
      savedAt:   data.savedAt   || '',
      data,
    })).sort((a,b) => new Date(b.savedAt) - new Date(a.savedAt));
    renderList(currentList);
  }

  // ════════════════════════════════════════════════════════
  // OPEN
  // ════════════════════════════════════════════════════════
  function openPresentation(pres) {
    App.loadBoardState(pres.data);
    hide();
    App.showToast(`📋 Opened: "${pres.name}"`);
  }

  // ════════════════════════════════════════════════════════
  // OVERWRITE
  // ════════════════════════════════════════════════════════
  function overwritePresentation(pres) {
    if (!confirm(`Overwrite "${pres.name}" with current board?`)) return;
    App.saveCurrent();
    const state   = App.getBoardState();
    state.name    = pres.name;
    state.subject = pres.subject || '';
    state.savedAt = new Date().toISOString();
    state.version = '2.0';
    const ok = storageSave(pres.id, state);
    if (ok) {
      refreshList();
      App.showToast(`✓ Updated: "${pres.name}"`);
    }
  }

  // ════════════════════════════════════════════════════════
  // RENAME
  // ════════════════════════════════════════════════════════
  function renamePresentation(pres) {
    const newName = prompt(`Rename "${pres.name}" to:`, pres.name);
    if (!newName || newName.trim() === pres.name) return;
    const updated  = { ...pres.data, name: newName.trim(), savedAt: new Date().toISOString() };
    const ok       = storageSave(pres.id, updated);
    if (ok) {
      refreshList();
      App.showToast(`✓ Renamed to: "${newName.trim()}"`);
    }
  }

  // ════════════════════════════════════════════════════════
  // DELETE
  // ════════════════════════════════════════════════════════
  function deletePresentation(pres) {
    if (!confirm(`Delete "${pres.name}"? This cannot be undone.`)) return;
    const ok = storageDelete(pres.id);
    if (ok) {
      refreshList();
      App.showToast(`Deleted: "${pres.name}"`);
    }
  }

  return { show, hide, toggle, refreshList };
})();

window.Library = Library;

</script>
